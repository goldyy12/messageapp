services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: messages_db
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

frontend:
  build: ./frontend
  ports:
    - "5173:5173"
  depends_on:
    - backend
  stdin_open: true
  tty: true
  env_file:
    - ./frontend/.env
